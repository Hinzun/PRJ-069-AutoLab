; AutoLab firmvér. Auto vyberieš prostredím:
;   pio run -e auto1 -t upload && pio run -e auto1 -t uploadfs
;   pio run -e auto2 -t upload && pio run -e auto2 -t uploadfs
; Testy logiky na PC, bez ESP32 (treba g++):
;   pio test -e native

[platformio]
default_envs = auto1

[esp32]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    ESP32Async/ESPAsyncWebServer@3.6.0
    ESP32Async/AsyncTCP@3.3.2
    bblanchon/ArduinoJson@7.2.1

[env:auto1]
extends = esp32
build_flags = -DCAR_ID=1 -DWIFI_CHANNEL=1

[env:auto2]
extends = esp32
build_flags = -DCAR_ID=2 -DWIFI_CHANNEL=6

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<control.cpp> +<params.cpp> +<protocol.cpp>
lib_deps = bblanchon/ArduinoJson@7.2.1
